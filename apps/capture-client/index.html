<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashcam Capture Client</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #0f172a;
        --panel: #111827;
        --accent: #38bdf8;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --border: #1f2937;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        background: radial-gradient(circle at top, #1e293b, var(--bg));
        color: var(--text);
      }
      .page {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        padding: 24px;
        gap: 24px;
      }
      header {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      header h1 {
        margin: 0;
        font-size: 1.6rem;
        letter-spacing: 0.02em;
      }
      header p {
        margin: 0;
        color: var(--muted);
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 20px;
      }
      @media (min-width: 900px) {
        .layout {
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        }
      }
      .panel {
        background: rgba(15, 23, 42, 0.72);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 16px;
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.35);
      }
      .panel h2 {
        margin: 0 0 12px 0;
        font-size: 1.1rem;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 12px;
      }
      .field label {
        font-size: 0.85rem;
        color: var(--muted);
      }
      .field input {
        background: #0b1220;
        border: 1px solid #1f2937;
        border-radius: 10px;
        color: var(--text);
        padding: 10px 12px;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      button {
        border: none;
        border-radius: 999px;
        padding: 10px 16px;
        background: var(--accent);
        color: #0b1120;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }
      button.secondary {
        background: #1f2937;
        color: var(--text);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      video {
        width: 100%;
        max-height: 380px;
        border-radius: 14px;
        background: #020617;
      }
      .status-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 12px;
      }
      .status-card {
        border: 1px solid #1f2937;
        border-radius: 12px;
        padding: 10px 12px;
        background: rgba(2, 6, 23, 0.6);
      }
      .status-card span {
        display: block;
        color: var(--muted);
        font-size: 0.8rem;
        margin-bottom: 6px;
      }
      .status-card strong {
        font-size: 1rem;
      }
      .log {
        font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", "Courier New", monospace;
        font-size: 0.85rem;
        background: #0b1120;
        border-radius: 12px;
        border: 1px solid #1f2937;
        padding: 12px;
        min-height: 140px;
        white-space: pre-wrap;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 999px;
        background: #1e293b;
        color: var(--text);
        font-size: 0.8rem;
      }
      .badge.online {
        background: rgba(56, 189, 248, 0.2);
        color: #7dd3fc;
      }
      .badge.offline {
        background: rgba(248, 113, 113, 0.2);
        color: #fca5a5;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/dist/main.js"></script>
  </body>
</html>
